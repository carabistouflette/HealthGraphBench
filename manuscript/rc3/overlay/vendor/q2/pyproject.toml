[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthgraphbench"
version = "0.2.0"
description = "A temporal benchmark for incremental relational value in public health and regulatory ML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
]
license = { file = "LICENSE" }
authors = [{ name = "HealthGraphBench contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
q2 = [
  "numpy==2.3.5",
  "scikit-learn==1.8.0",
  "numba==0.68.0",
]

[project.scripts]
healthgraphbench = "healthgraphbench.cli:main"

[tool.setuptools.packages.find]
include = ["healthgraphbench*"]


[tool.setuptools.package-data]
"healthgraphbench.tasks.partd" = ["task_contract_v0_2.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
