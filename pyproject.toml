[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthgraphbench"
version = "0.1.0"
description = "A temporal benchmark for incremental relational value in public health and regulatory ML"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "HealthGraphBench contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
healthgraphbench = "healthgraphbench.cli:main"

[tool.setuptools.packages.find]
include = ["healthgraphbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
